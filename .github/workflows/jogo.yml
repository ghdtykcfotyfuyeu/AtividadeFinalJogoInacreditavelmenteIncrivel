name: Verificar e exportar jogo

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar_pagina:
        description: Publicar pagina no GitHub Pages (habilite Pages nas configuracoes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jogo-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3

jobs:
  verificar-exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot e modelos oficiais
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d godot
          chmod +x "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Importar e testar
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --path . --fixed-fps 60 --script res://scripts/testes/test_partida.gd
          godot --headless --path . --fixed-fps 60 --script res://scripts/testes/test_horda.gd
      - name: Exportar Windows, Linux e Web
        run: |
          mkdir -p exports/windows exports/linux exports/web
          godot --headless --path . --export-release Windows
          godot --headless --path . --export-release Linux
          godot --headless --path . --export-release Web
          mkdir -p exports/site/jogar exports/site/assets
          cp web/index.html exports/site/index.html
          cp exports/web/* exports/site/jogar/
          cp docs/capturas/partida.png exports/site/assets/sala.png
          cp sprites/inimigos/prova.png exports/site/assets/prova.png
      - name: Disponibilizar executaveis e pagina
        uses: actions/upload-artifact@v4
        with:
          name: ProvasVoadoras-exportacoes
          path: exports/
          retention-days: 30
      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: exports/site

  publicar:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publicar_pagina)
    needs: verificar-exportar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
